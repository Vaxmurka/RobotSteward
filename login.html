<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" type="text/css" href="./styles/styles.css">
</head>
<body>
<section class="login">
    <img src="images/index/train.jpg" alt="background"
         width="5610" height="3739" class="login__background_image">
    <div class="login__content">
        <form>
            <h2 class="login__content_header">Вход</h2>
            <div class="login__content_information-field">
                <p>
                    Пожалуйста, введите 14-значный номер вашего билета.<br>
                    Желаем приятного путешествия!
                </p>
            </div>
            <div class="login__content_input-field">
                <input id="ticketNumberInput" type="text" required>
                <label>Введите номер своего билета</label>
            </div>
            <button class="login__btn" type="button" onclick="login()">Войти</button>
        </form>
    </div>
</section>

<script>
    function login() {
        const input = document.querySelector("#ticketNumberInput");
        const ticketNumber = input.value;

        document.cookie = `Ticket=${ticketNumber}; path=/`

        const urlParams = new URLSearchParams(window.location.search);
        let next = urlParams.has("next") ? urlParams.get("next") : "/static/index.html";
        window.location.href = next;
    }
</script>
</body>
</html>
