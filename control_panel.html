<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        img {
            max-width: 40%;
            border: 2px solid #444;
            margin-bottom: 20px;
        }

        svg {
            width: 100%;
            height: auto;
        }
    </style>

    <script src="/static/scripts/ws_video_stream.js"></script>
    <script src="/static/scripts/gui_channel.js"></script>

</head>
<body>
<p class="subtitle is-4 has-text-centered mt-3 mb-0">Панель управления</p>
<section class="section is-fullwidth container is-fluid">
    <div class="box">
        <p class="subtitle is-4 has-text-centered">Потоки</p>
        <div id="streams-tabs" class="tabs">
            <ul>

            </ul>
        </div>
        <img id="stream-image">
    </div>
    <div class="box" id="passport-box" style="display: none;">
        <p class="subtitle is-4 has-text-centered">Проверка паспорта</p>

        <input class="input mr-3" type="text" placeholder="3620 876543" style="max-width: 250px;"/>
        <button class="button is-success" onclick="submitPassport()">Submit</button>
        <button class="button is-danger ml-2" onclick="declinePassport()">Decline</button>
    </div>
    <div class="box" id="face-box" style="display: none;">
        <p class="subtitle is-4 has-text-centered">Проверка биометрии</p>

        <button class="button is-success" onclick="confirmFace()">Submit</button>
        <button class="button is-danger ml-2" onclick="declineFace()">Decline</button>
    </div>
    <div class="box">
        <p class="subtitle is-4 has-text-centered">Навигация</p>
        
        <svg id="chartRoot" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
</section>

<script>
    CHANNEL_PATH = "/control_panel";
</script>

<script src="/static/scripts/cp_streams.js"></script>
<script src="/static/scripts/cp_chart.js"></script>

<script>
    window.addEventListener("channel_ready", function (event) {

        event.detail.channel.addEventListener("code_passport_request", function (event) {
            showPassportRequest();
        });

        event.detail.channel.addEventListener("code_face_request", function (event) {
            showFaceRequest();
        });

    });

    passportTimeoutId = NaN;
    faceTimeoutId = NaN;

    function showPassportRequest() {
        setActiveStream("documents_camera");

        $("#passport-box").show();
        $("#passport-box input").val("");

        passportTimeoutId = setTimeout(hidePassportRequest, 30000);
    }

    function submitPassport() {
        const value = $("#passport-box input").val().replace(" ", "");
        channel.send("passport_response", {"passport_number": value});
        hidePassportRequest();
    }

    function declinePassport() {
        channel.send("passport_response", {"passport_number": null});
        hidePassportRequest();
    }

    function hidePassportRequest() {
        $("#passport-box").hide();
        $("#passport-box input").val("");

        if (!isNaN(passportTimeoutId)) {
            clearTimeout(passportTimeoutId);
            passportTimeoutId = NaN;
        }
    }

    function showFaceRequest() {
        setActiveStream("passport_history");

        $("#face-box").show();

        faceTimeoutId = setTimeout(hideFaceRequest, 30000);
    }

    function confirmFace() {
        channel.send("face_response", {"result": true});
        hideFaceRequest();
    }

    function declineFace() {
        channel.send("face_response", {"result": false});
        hideFaceRequest();
    }

    function hideFaceRequest() {
        $("#face-box").hide();

        if (!isNaN(faceTimeoutId)) {
            clearTimeout(faceTimeoutId);
            faceTimeoutId = NaN;
        }
    }
</script>

</body>
</html>
